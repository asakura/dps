[package]
name = "dps"
version = "0.1.2"
edition = "2024"
authors = ["Mikalai Seva"]
description = "A terminal UI application for scuba dive planning"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asakura/dps"
readme = "README.md"
keywords = ["diving", "dive-planning", "scuba", "tui"]
categories = ["command-line-utilities"]

[lib]
doctest = false

[build-dependencies]
anyhow.workspace = true
vergen-gix.workspace = true
vergen.workspace = true

[dependencies]
approx.workspace = true
arboard.workspace = true
better-panic.workspace = true
clap.workspace = true
color-eyre.workspace = true
crossterm.workspace = true
directories.workspace = true
dps-environment = { workspace = true, features = ["serde"] }
dps-gas = { workspace = true, features = ["serde"] }
dps-units = { workspace = true, features = ["serde"] }
futures.workspace = true
human-panic.workspace = true
json5.workspace = true
ratatui.workspace = true
serde-saphyr.workspace = true
serde.workspace = true
signal-hook.workspace = true
strip-ansi-escapes.workspace = true
strum.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
tokio.workspace = true
toml.workspace = true
tracing-error.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
serde_json.workspace = true
serial_test.workspace = true
temp-env.workspace = true
tempfile.workspace = true

[workspace]
members = [
    "lib/environment",
    "lib/gas",
    "lib/units",
]

[workspace.dependencies]
# Internal crates
dps-environment = { path = "lib/environment", version = "0.1.2" }
dps-gas = { path = "lib/gas", version = "0.1.3" }
dps-units = { path = "lib/units", version = "0.1.2" }

# External crates
anyhow = { version = "1.0", default-features = false }
approx = { version = "0.5", default-features = false }
arboard = { version = "3.6", default-features = false }
better-panic = { version = "0.3", default-features = false }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "cargo"] }
color-eyre = { version = "0.6", default-features = false, features = ["track-caller"] }
crossterm = { version = "0.29", default-features = false, features = ["event-stream", "serde"] }
directories = { version = "6.0", default-features = false }
futures = { version = "0.3", default-features = false }
human-panic = { version = "2.0", default-features = false }
json5 = { version = "1.3", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["std", "crossterm"] }
rstest = { version = "0.29", default-features = false }
ryu = { version = "1.0", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-saphyr = { version = "2.0", default-features = false, features = ["serialize", "deserialize"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
serial_test = { version = "4.0", default-features = false }
signal-hook = { version = "0.4", default-features = false }
strip-ansi-escapes = { version = "0.2", default-features = false }
strum = { version = "0.28", features = ["derive"] }
temp-env = { version = "0.3", default-features = false }
tempfile = { version = "3.27", default-features = false }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7", default-features = false }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
tracing = { version = "0.1", default-features = false }
tracing-error = { version = "0.2", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vergen = { version = "10.0", features = ["build"] }
vergen-gix = { version = "10.0", default-features = false }

[workspace.lints.rust]
# Safety — forbid means even #![allow(...)] can't override
unsafe_code = "forbid"
non_ascii_idents = "forbid"

# Quality enforcement
warnings = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

# Documentation enforcement
missing_docs = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unfulfilled_lint_expectations = "deny"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# All lint groups
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Guardrails
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Code hygiene
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Async safety
await_holding_lock = "deny"
large_futures = "deny"

# Process and memory safety
exit = "deny"
mem_forget = "deny"

# Performance
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"

# Minimal relaxations
multiple_crate_versions = "allow"   # unavoidable with transitive deps

# Cast lints — too many false positives even for strict projects
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"

# Nursery lints that have too many false positives
cognitive_complexity = "allow"      # use clippy.toml threshold instead

[lints]
workspace = true

[profile.dev]
debug = 1

[profile.test]
debug = 1
split-debuginfo = "unpacked"

[profile.mutants]
inherits = "test"
debug = "none"
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"
