name: Update flake.lock

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-flake-lock:
    # No `pull_request` trigger exists for this workflow at all (schedule /
    # manual dispatch only); this guard additionally no-ops the job if a fork
    # happens to enable this scheduled workflow on their own copy.
    if: github.repository_owner == 'asakura'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: asakura/actions/.github/actions/setup-nix@32fd43107b80ca9d29152b5d32d4bb61e8723527 # v1.0.0
        with:
          github-token: ${{ github.token }}


      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17 # pin-comment: no vX.Y.Z tag upstream
        with:
          name: dps
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29 # pin-comment: no vX.Y.Z tag upstream
        with:
          pr-title: "chore(flake): update flake.lock"
          pr-labels: |
            dependencies
            automated
