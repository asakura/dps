# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
#
# Run locally with `nix develop -c cargo deny check` (or plain `cargo deny
# check` if cargo-deny is installed). CI runs this as part of `ci.yml`.

[graph]
all-features = false
no-default-features = false
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
unsound = "all"
unmaintained = "all"
yanked = "warn"
maximum-db-staleness = "P30D"
unused-ignored-advisory = "warn"

# Everything below is reached only through `dps-git-stats` (via
# `polars` and `gix`), not the `dps` binary's own code paths. Vetted as
# acceptable until upstream bumps or replaces the affected crates.
ignore = [
    # Unmaintained, pulled in by `polars-utils` / `polars-arrow`.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; transitive via polars-utils" },
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; transitive via polars-arrow/chrono-tz" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained; transitive via polars-arrow" },
    # Unmaintained / DoS in `object_store` deps (polars cloud IO layer).
    { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained; transitive via object_store" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml quadratic attr check; transitive via object_store" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml NsReader alloc DoS; transitive via object_store" },
    # `heapless` 0.8.0 unsoundness, pulled in by `faster-hex` 0.10 (via
    # `gix-hash`).
    { id = "RUSTSEC-2026-0574", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
    { id = "RUSTSEC-2026-0575", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
    { id = "RUSTSEC-2026-0576", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
    { id = "RUSTSEC-2026-0577", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
    { id = "RUSTSEC-2026-0578", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
    { id = "RUSTSEC-2026-0579", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
    { id = "RUSTSEC-2026-0580", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
    { id = "RUSTSEC-2026-0581", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
    { id = "RUSTSEC-2026-0582", reason = "heapless unsound; transitive via faster-hex/gix-hash" },
]

# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # allowed, but no matching crates yet
    # "CC0-1.0",
    # ISC: `ring`, `untrusted`, `rustls-webpki` (via `object_store`/`reqwest`).
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
include-dev = true
unused-allowed-license = "warn"

# `option-ext` (pulled in transitively via `directories` -> `dirs-sys`) is
# MPL-2.0. It is used unmodified, so its weak/file-level copyleft does not
# extend to this workspace's code.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "option-ext"

# `uluru` (pulled in via `gix` -> `gix-pack`, from `dps-git-stats`) is
# MPL-2.0. Same reasoning as `option-ext`: used unmodified.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uluru"

# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
[bans]
multiple-versions = "warn"
multiple-versions-include-dev = true
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# Vetted duplicate versions: a transitive dependency is still pinned to an
# older major/minor release while the rest of the graph has moved on. Each
# entry skips that older version so `multiple-versions` stays quiet for this
# known pair and would only fire again if a *third* version showed up.

# 0.14.5 is pinned by `dashmap`, 0.15.5 by `gix-imara-diff` (via `gix-diff`),
# and 0.16.1 by `clru`/`kasuari` (all reached via
# `gix-tempfile`/`gix-pack`/`ratatui-core`); `gix-hashtable` is on the
# newest, 0.17.2.
[[bans.skip]]
name = "hashbrown"
version = "0.14.5"

[[bans.skip]]
name = "hashbrown"
version = "0.15.5"

[[bans.skip]]
name = "hashbrown"
version = "0.16.1"

# 0.3.18 is pinned by `crossterm` (via `ratatui-crossterm`); dps and `gix`
# (via `vergen-gix`) depend directly on 0.4.4.
[[bans.skip]]
name = "signal-hook"
version = "0.3.18"

# 3.0.3 is pinned by `serial_test_derive` (dev-only, via `serial_test`);
# everything else is on 2.0.117.
[[bans.skip]]
name = "syn"
version = "3.0.3"

# 0.22.1 is pinned by `object_store`/`reqwest`/`polars-parquet`;
# `hyper-util` and `serde-saphyr` are on 0.23.1.
[[bans.skip]]
name = "base64"
version = "0.22.1"

# 0.10.1 is pinned by `gix-hash`; `gix-packetline` is on 2.0.0.
[[bans.skip]]
name = "faster-hex"
version = "0.10.1"

# 0.1.5 is pinned by `hashbrown` 0.15.5; newer `hashbrown` and
# `polars-utils` are on 0.2.0.
[[bans.skip]]
name = "foldhash"
version = "0.1.5"

# 0.2.17 is pinned by `ring`; everything else (tempfile, uuid, rand,
# gix-utils, polars-core) is on 0.4.3.
[[bans.skip]]
name = "getrandom"
version = "0.2.17"

# 0.44.1 / 0.18.1 are used by most of `gix` 0.90; `gix-mailmap` 0.36.2
# already moved to `gix-actor` 0.45 / `gix-date` 0.19. Resolves on the next
# coordinated `gix` release.
[[bans.skip]]
name = "gix-actor"
version = "0.44.1"

[[bans.skip]]
name = "gix-date"
version = "0.18.1"

# 0.14.0 is pinned by `ratatui-*`, `unicode-truncate`, `object_store`;
# `catppuccin` is on 0.15.0.
[[bans.skip]]
name = "itertools"
version = "0.14.0"

# 0.2.x is pulled in by `gix-date` 0.18.1, 1.x by `gix-date` 0.19.0
# (see `gix-date` above).
[[bans.skip]]
name = "jiff"
version = "0.2.46"

[[bans.skip]]
name = "jiff-core"
version = "0.1.8"

# 0.12.x / 0.9.x / 0.4.x are used by most of the graph (crossterm,
# polars, gix, dashmap, ...); `gix-parallel`/`gix-prompt` moved to
# `parking_lot` 0.13.
[[bans.skip]]
name = "lock_api"
version = "0.4.14"

[[bans.skip]]
name = "parking_lot"
version = "0.12.5"

[[bans.skip]]
name = "parking_lot_core"
version = "0.9.12"

# 0.8.9 is pinned by `png`; `flate2` and `backtrace` are on 0.9.1.
[[bans.skip]]
name = "miniz_oxide"
version = "0.8.9"

# 0.39.1 is pinned by `ar_archive_writer`; `backtrace` is on 0.40.0.
[[bans.skip]]
name = "object"
version = "0.39.1"

# 0.38.4 is pinned by `human-panic`; `polars-utils` is on 0.39.6.
[[bans.skip]]
name = "sysinfo"
version = "0.38.4"

[bans.build]
include-workspace = false
include-dependencies = true
executables = "warn"
interpreted = "warn"

